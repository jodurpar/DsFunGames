name: scifyclub

services:
  dsfungames:
    image: jodurpar/dsfungames-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsfungames-web
    restart: unless-stopped
    ports:
      - "15260:80"
    environment:
      - NODE_ENV=production
    networks:
      - scifyclub-network

networks:
  scifyclub-network:
    driver: bridge
